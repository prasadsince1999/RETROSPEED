<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#grad)" />
  <!-- Key shape -->
  <rect x="22" y="22" width="56" height="56" rx="12" fill="url(#keyGrad)" filter="drop-shadow(0px 6px 4px rgba(0,0,0,0.25))" />
  <rect x="26" y="25" width="48" height="46" rx="8" fill="#f8fafc" />
  <!-- Letter K stylized -->
  <text x="50" y="58" font-family="'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#0284c7" text-anchor="middle" dominant-baseline="middle">K</text>
</svg>
